[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "three_col_circle_code"
version = '0.1.0'
description = 'Experimental infrastructure for circle graph 3-coloring benchmarks'
requires-python = ">=3.7"
license = "MIT"
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "networkx",
  #"pandas",
  #"seaborn",
  #"matplotlib",
  "jinja2",
  "plotly",
  "setuptools",
  "pysmt",
  "python-sat",
  "pydot",
  #"scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
benchmark_run = "three_col_circle_code.bench.runner:main"
benchmark_plan = "three_col_circle_code.bench.plan:main"
benchmark_generate_instance = "three_col_circle_code.bench.generate_instance:main"
benchmark_generate_instance_sequence = "three_col_circle_code.bench.generate_instance:sequence_main"
benchmark_run_instance_sequence = "three_col_circle_code.bench.run_sequence:main"
benchmark_run_trial = "three_col_circle_code.bench.run_trial:main"
benchmark_merge = "three_col_circle_code.bench.merge:main"
benchmark_status = "three_col_circle_code.bench.status:main"
instance_export_dimacs_circle = "three_col_circle_code.instances.dimacs_circle:main"
